version: '3.8'

services:
  app:
    build: .
    container_name: american-caffetteria
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - telegram_bot/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DB_PATH=/app/telegram_bot/data/cafe_bot.db
    volumes:
      - ./telegram_bot/data:/app/telegram_bot/data
