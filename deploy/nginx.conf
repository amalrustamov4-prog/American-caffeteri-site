# American Caffetteria — Production Nginx Configuration
# Reverse Proxy with SSE streaming & WebSocket support

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream cafe_backend {
        server app:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 25M;

        # Healthcheck endpoint (no logs)
        location = /api/health {
            proxy_pass http://cafe_backend;
            proxy_set_header Host $host;
            access_log off;
        }

        # Real-time Server-Sent Events (SSE) & Live POS stream
        location ~ ^/api/(?:admin/)?stream$ {
            proxy_pass http://cafe_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CRITICAL FOR SSE: Disable proxy buffering
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # All other APIs and Web Interface
        location / {
            proxy_pass http://cafe_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Security Headers
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}
