name: American Caffetteria CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Syntax, Unit & Real-Time API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r telegram_bot/requirements.txt

      - name: Check JS & Python syntax
        run: |
          node --check app.js
          node --check admin.js
          node --check menu_data.js
          node --check local_preview.js
          node --check sw.js
          node --check api/orders.mjs
          node --check api/register.mjs
          python -m py_compile telegram_bot/bot.py sync_web.py tests/test_suite.py tests/test_realtime_endpoints.py

      - name: Sync web assets to www/ and Android
        run: python sync_web.py

      - name: Run unit & catalog tests (3/3)
        run: python tests/test_suite.py

      - name: Run Real-Time POS & API endpoint tests (9/9)
        run: python tests/test_realtime_endpoints.py

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-and-verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: american-caffetteria:ci

  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test-and-verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync assets to Android
        run: python sync_web.py

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload American_Caffetteria.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: American_Caffetteria-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
